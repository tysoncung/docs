# Link check for docs using lychee.
# Builds docs, starts the dev server, and validates links directly against localhost.
# Creates a Linear ticket if broken links are found.
#
# Required secrets:
#   LINEAR_API_KEY - Linear API key from https://linear.app/settings/api
#   LINEAR_TEAM_KEY - Team key for the created issue (e.g. ENG)

name: "🔗 Docs Link Check"

on:
  push:
    branches: [main]
  pull_request:
# on:
#   schedule:
#     # Run every Monday at 00:00 UTC
#     - cron: "0 0 * * 1"
#   workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "true"
  UV_NO_SYNC: "true"

jobs:
  check-links:
    name: "Check docs links"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "📋 Checkout"
        uses: actions/checkout@v6

      - name: "Configure Python with uv"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.13"

      - name: "Install Python dependencies"
        run: uv sync --group test

      - name: "Configure Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "Install Mintlify CLI"
        run: npm i -g mint@latest

      - name: "Build documentation"
        run: PYTHONPATH=. uv run pipeline build

      - name: "Start Mint dev server"
        env:
          CI: "true"
          TERM: "dumb"
          FORCE_COLOR: "0"
        run: |
          cd build
          nohup mint dev --port 3000 > /tmp/mint.log 2>&1 &
          echo "Waiting for dev server..."
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "Server failed to start. Log:"
              cat /tmp/mint.log
              exit 1
            fi
            sleep 2
          done

      - name: "Generate lychee URL list"
        run: |
          python3 scripts/generate_lychee_urls.py build/docs.json http://localhost:3000 lychee-urls.txt
          echo "Generated $(wc -l < lychee-urls.txt) URLs to check"

      - name: "Run lychee"
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --files-from lychee-urls.txt"
          fail: false
          format: markdown
          output: lychee-output.md

      - name: "Show lychee results"
        run: |
          echo "--- Lychee link check results ---"
          if [ -f lychee-output.md ]; then cat lychee-output.md; else echo "No output file"; fi

      - name: "Upload lychee output"
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lychee-output
          path: lychee-output.md

      - name: "Create Linear ticket on broken links"
        if: steps.lychee.outputs.exit_code != '0'
        uses: ctriolo/action-create-linear-issue@v0.7
        with:
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          linear-team-key: ${{ secrets.LINEAR_TEAM_KEY }}
          linear-issue-title: "[Docs] Broken links detected in documentation build"
          linear-issue-description: |
            lychee found broken links during the docs link check (local build).

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            See the workflow logs for full lychee output.
          linear-attachment-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          linear-attachment-title: "GitHub Actions run"
